name: macOS private-source verification
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed immutable private source commit
        required: true
        default: 'e31e077e7ed5e523af221a872b30bf5ac4adc885'
      stage:
        description: Native Mac validation scope
        type: choice
        options: [probe, build]
        default: probe
permissions: {}
concurrency:
  group: macos-private-source-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  macos:
    if: github.repository == 'occat666/occat-live-caption-download' && github.ref == 'refs/heads/main' && github.actor == 'occat666'
    name: ${{ matrix.arch }} / ${{ inputs.stage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      OCCAT_ARCH: ${{ matrix.arch }}
      OCCAT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read public build controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Verify native environment
        run: |
          test "$(uname -m)" = "$OCCAT_ARCH"
          node --version
          sw_vers
      - name: Fetch reviewed private source with read-only deploy key
        env:
          OCCAT_SOURCE_SSH_KEY: ${{ secrets.OCCAT_SOURCE_READ_SSH_KEY }}
        run: python .github/macos/private_build.py checkout
      - name: Check native build cache validation
        run: python .github/macos/private_build.py tests
      - name: Verify dependency wheels and macOS GUI
        run: python .github/macos/private_build.py probe
      - name: Ensure native build tools
        if: inputs.stage == 'build'
        run: |
          for formula in pkg-config nasm gnupg; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
      - name: Rebuild LGPL PyAV and ASR-only sherpa
        if: inputs.stage == 'build'
        env:
          OCCAT_NATIVE_CACHE_TOKEN: ${{ github.token }}
        run: python .github/macos/private_build.py native
      - name: Build and smoke test application and DMG
        if: inputs.stage == 'build'
        run: python .github/macos/private_build.py bundle
      - name: Verify frozen CPU inference and system HTTPS trust
        if: inputs.stage == 'build'
        run: python .github/macos/private_build.py inference
      - name: Encrypt private build diagnostics and candidates
        if: always()
        run: python .github/macos/private_build.py package
      - name: Retain encrypted review envelope in draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="macos-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${OCCAT_ARCH}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Private Mac review / ${GITHUB_RUN_ID} / ${OCCAT_ARCH}" \
            --notes 'Encrypted build review only. This is not a published application release.'
          gh release upload "$tag" outgoing/*
